<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Chi tiết giao dịch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<script th:src="@{/js/app.js}"></script></head>
<body class="container mt-4">
<div class="row justify-content-center">
<div class="col-md-6">
<h2 class="mb-3 text-center">Chi tiết giao dịch</h2>
<div th:if="${giaoDich!=null}">
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Mã GD</label><div class="col-sm-8"><span th:text="${giaoDich.maGiaoDich}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Loại DV</label><div class="col-sm-8"><span th:text="${giaoDich.loaiDichVu}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Ngày GD</label><div class="col-sm-8"><span th:text="${giaoDich.ngayGiaoDich}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Đơn giá</label><div class="col-sm-8"><span th:text="${giaoDich.donGia}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Diện tích</label><div class="col-sm-8"><span th:text="${giaoDich.dienTich}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Tên KH</label><div class="col-sm-8"><span th:text="${giaoDich.khachHang.tenKhachHang}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">SĐT</label><div class="col-sm-8"><span th:text="${giaoDich.khachHang.soDienThoai}"></span></div></div>
    <div class="mb-3 row"><label class="col-sm-4 col-form-label">Email</label><div class="col-sm-8"><span th:text="${giaoDich.khachHang.email}"></span></div></div>
    <div class="d-flex justify-content-center gap-2 mt-3">
        <form th:action="@{'/giao-dich/'+${giaoDich.maGiaoDich}+'/xoa'}" method="post" onsubmit="return confirmDelete()" style="display:inline">
            <button type="submit" class="btn btn-warning">Xóa</button>
        </form>
        <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>
    </div>
</div>
</div>
</div>
</body>
</html>
