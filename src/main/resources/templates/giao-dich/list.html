<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Danh sách giao dịch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body class="container mt-4">
<h2 class="mb-3">Danh sách giao dịch</h2>
<div class="d-flex justify-content-between align-items-center mb-3">
    <a th:href="@{/giao-dich/them}" class="btn btn-primary">Thêm mới</a>
    <form th:action="@{/}" method="get" class="d-flex gap-2">
        <input type="text" name="ten" th:value="${ten}" class="form-control" placeholder="Tên khách hàng" style="height:38px"/>
        <select name="loai" class="form-select" style="height:38px">
            <option value="">-- Loại dịch vụ --</option>
            <option value="Đất" th:selected="${loai=='Đất'}">Đất</option>
            <option value="Nhà và đất" th:selected="${loai=='Nhà và đất'}">Nhà và đất</option>
        </select>
        <button type="submit" class="btn btn-primary text-nowrap">Tìm kiếm</button>
    </form>
</div>
<table border="1">
    <tr><th>Mã GD</th><th>Tên KH</th><th>Loại DV</th><th>Ngày GD</th><th>Đơn giá</th><th>Diện tích</th><th>Chi tiết</th></tr>
    <tr th:each="g : ${list}">
        <td th:text="${g.maGiaoDich}"></td>
        <td th:text="${g.khachHang.tenKhachHang}"></td>
        <td th:text="${g.loaiDichVu}"></td>
        <td th:text="${g.ngayGiaoDich}"></td>
        <td th:text="${g.donGia}"></td>
        <td th:text="${g.dienTich}"></td>
        <td><a th:href="@{'/giao-dich/'+${g.maGiaoDich}}">Chi tiết</a></td>
    </tr>
</table>
</body>
</html>
